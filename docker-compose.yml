services:
  postgres:
    image: postgres:16-alpine
    container_name: support-ticket-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-support_ticket}
      POSTGRES_USER: ${POSTGRES_USER:-support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-support} -d ${POSTGRES_DB:-support_ticket}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: support-ticket-backend
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-support_ticket}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-support}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-support}
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
